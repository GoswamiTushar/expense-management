<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Ledger | Split • Track • Settle</title>

    <!-- PWA Primary Colors & Display Settings -->
    <meta name="theme-color" content="#0F121A" />
    <meta name="background-color" content="#0C0E14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ledger" />

    <!-- Apple Web App & Status Bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Manifest & Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Google Fonts: Modern Fintech Typography (Plus Jakarta Sans & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* Apply modern typography globally across all elements */
      html,
      body,
      #root,
      button,
      input,
      select,
      textarea,
      div,
      span,
      p {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* These styles make the body full-height and dark before JS executes */
      html,
      body {
        height: 100%;
        background-color: #0C0E14 !important;
        color-scheme: dark;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #0C0E14 !important;
      }
      /* These styles make the root element full-height and dark */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0C0E14 !important;
      }
    </style>
  </head>

  <body style="background-color: #0C0E14;">
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root" style="background-color: #0C0E14;"></div>

    <script>
      // Register Service Worker for true OS notifications on mobile web / PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('[SW] Registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
